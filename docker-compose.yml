services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: protein_server
    ports:
      - "5000:5000"
    volumes:
      - ./Server:/app
      - /app/node_modules
    env_file:
      - ./Server/.env
    environment:
      - PORT=5000
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: protein_client
    ports:
      - "5173:5173"
    volumes:
      - ./Client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped
